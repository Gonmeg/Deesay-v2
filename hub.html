<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deesay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="auth.js?v=1"></script>
<link rel="stylesheet" href="ui.css?v=1">
<style>
/* hub.html (2026-11-23) — หน้าหลัก: เลือกระบบ Dashboard / Warehouse · ใช้ login และข้อมูลชุดเดียวกัน
   คนที่เข้าได้ระบบเดียว (ยังไม่มีสิทธิ์ Warehouse) ไม่ต้องเห็นหน้านี้ → พาไป Dashboard เลย */
*{box-sizing:border-box}
html.hub-wait body{visibility:hidden}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--pg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.hb-top{display:flex;align-items:center;gap:10px;padding:18px 28px}
.hb-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:17px}
.hb-brand b{display:block;font-size:16px;line-height:1.1}.hb-brand small{font-size:12px;color:var(--text3)}
.hb-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px 64px}
.hb-hi{font-size:24px;font-weight:600;margin:0 0 4px;text-align:center}
.hb-sub{color:var(--text2);font-size:14px;margin:0 0 28px;text-align:center}
.hb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,340px));gap:22px;width:100%;justify-content:center}
.hb-card{display:flex;flex-direction:column;gap:14px;padding:26px 26px 22px;border-radius:14px;background:var(--bg2);box-shadow:var(--sh);border:1px solid var(--panel-line);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.hb-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.hb-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hb-ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.hb-ic svg{width:26px;height:26px}
.hb-card h2{font-size:20px;margin:0}
.hb-card p{margin:0;color:var(--text2);font-size:13.5px;line-height:1.6}
.hb-go{margin-top:auto;font-size:13px;font-weight:600;color:var(--accent-text)}
.hb-ft{display:flex;justify-content:center;gap:14px;align-items:center;padding:0 28px 22px;font-size:12px;color:var(--text3)}
.hb-ft button{border:0;background:none;color:var(--text2);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
@media (max-width:760px){.hb-grid{grid-template-columns:minmax(0,1fr)}}
</style>
<script>document.documentElement.classList.add('hub-wait');try{if(localStorage.getItem('deesay_theme')==='light')document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('light-theme'));}catch(e){}</script>
</head>
<body>
<header class="hb-top"><div class="hb-mark">D</div><div class="hb-brand"><b>Deesay</b><small>หน้าหลัก</small></div></header>
<main class="hb-main">
  <h1 class="hb-hi" id="hbHi">สวัสดี</h1>
  <p class="hb-sub">เลือกระบบที่จะใช้งาน</p>
  <div class="hb-grid">
    <a class="hb-card" href="dashboard.html">
      <span class="hb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 17v-6"/><path d="M11 17V6"/><path d="M16 17v-4"/></svg></span>
      <h2>Dashboard</h2>
      <p>ยอดขาย · การตลาด · Ads · รายงานผู้บริหาร</p>
      <span class="hb-go">เข้าใช้งาน →</span>
    </a>
    <a class="hb-card" href="warehouse.html">
      <span class="hb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5v8l-9 5-9-5V8l9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg></span>
      <h2>Warehouse</h2>
      <p>ปริ้นใบปะหน้า · สรุปการจัดส่ง · ประวัติการปริ้น</p>
      <span class="hb-go">เข้าใช้งาน →</span>
    </a>
  </div>
</main>
<footer class="hb-ft"><span id="hbMail"></span><button type="button" id="hbTheme">สลับโหมดสว่าง / มืด</button><button type="button" id="hbOut">ออกจากระบบ</button></footer>
<script>
(async () => {
  const p = await Auth.require('dashboard');
  // สิทธิ์ Warehouse: ตอนนี้เฉพาะผู้ดูแลระบบ (ตรงกับ warehouse.html / wh-labels) — เปิดให้ทีมแพ็คเมื่อไรแก้ที่นี่ + sidebar.js
  if (!p.is_admin) { location.replace('dashboard.html'); return; }
  const name = p.name || String(p.email || '').split('@')[0];
  document.getElementById('hbHi').textContent = name ? `สวัสดี ${name}` : 'สวัสดี';
  document.getElementById('hbMail').textContent = p.email || '';
  document.getElementById('hbTheme').onclick = () => { document.body.classList.toggle('light-theme'); try { localStorage.setItem('deesay_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark'); } catch (e) {} };
  document.getElementById('hbOut').onclick = () => Auth.signOut();
  document.documentElement.classList.remove('hub-wait');
})();
</script>
</body>
</html>
