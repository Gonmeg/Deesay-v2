# (2026-11-02) เผยแพร่เว็บ (GitHub Pages) + ใส่เลขเวอร์ชันไฟล์ (?v=) ให้อัตโนมัติ — ไม่ต้องเปลี่ยนเลขเอง และ push เฉพาะไฟล์ที่แก้
# ตั้งครั้งเดียว: Settings → Pages → Build and deployment → Source = "GitHub Actions"
name: เผยแพร่เว็บ
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: ใส่เลขเวอร์ชันไฟล์อัตโนมัติ
        run: node tests/stamp-versions.mjs
      - name: เตรียมไฟล์เว็บ (ไม่รวมไฟล์ทดสอบ)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='_site' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
