<script type="module">
await Auth.ready

if (localStorage.getItem('deesay_theme') === 'light') document.body.classList.add('light-theme')
document.getElementById('themeBtn').onclick = () => { document.body.classList.toggle('light-theme'); localStorage.setItem('deesay_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark') }
const DB = createClient(window.SUPABASE_URL || 'https://plfdizmjdmhyjqraohfv.supabase.co', window.SUPABASE_ANON_KEY)

// ===== วันที่รู้จัก (แก้ตรงนี้ถ้าเปลี่ยน) =====
const FB_TOKEN_EXPIRY_FALLBACK = '2026-10-15' // ใช้เมื่อ fb_pages ไม่มีคอลัมน์วันหมดอายุ
const UNKNOWN_SKU_DAYS = 180                  // ย้อนหลังกี่วันที่จะเช็ค SKU ที่ products ไม่รู้จัก

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
const fmt = n => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toLocaleString('th-TH')
const th = d => d ? new Date(d).toLocaleString('th-TH', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—'
const ago = d => { if (!d) return '—'; const m = (Date.now() - new Date(d).getTime()) / 60000; return m < 60 ? `${Math.round(m)} นาทีก่อน` : m < 1440 ? `${(m/60).toFixed(1)} ชม.ก่อน` : `${(m/1440).toFixed(1)} วันก่อน` }
const daysTo = d => Math.ceil((new Date(d + 'T00:00:00').getTime() - Date.now()) / 86400000)

// คาดว่า cron ควรรันทุกกี่นาที จาก schedule (รองรับรูปแบบง่ายๆ)
function expectedMinutes(sched) {
  const p = (sched || '').trim().split(/\s+/); if (p.length < 5) return null
  const [min, hour, dom, mon, dow] = p
  if (min.startsWith('*/')) return parseInt(min.slice(2))
  if (hour === '*') return 60
  if (hour.startsWith('*/')) return parseInt(hour.slice(2)) * 60
  if (dom === '*' && dow === '*') return 1440
  if (dow !== '*') return 10080
  return null
}
// ชั่วโมง (UTC) ปัจจุบันอยู่ในช่วงที่ตั้งให้ทำงานไหม เช่น "15-23" · "1,5,9" · "*/2"
function inHours(f, h) { return String(f).split(',').some(p => p === '*' ? true : p.startsWith('*/') ? h % (+p.slice(2) || 1) === 0 : p.includes('-') ? (h >= +p.split('-')[0] && h <= +p.split('-')[1]) : +p === h) }
function cronState(j) {
  if (!j.active) return ['muted', 'ปิดใช้งาน']
  if (!j.last_start) return ['warn', 'ยังไม่เคยทำงาน']
  const exp = expectedMinutes(j.schedule)
  const lateMin = (Date.now() - new Date(j.last_start).getTime()) / 60000
  if (j.last_status === 'running' || j.last_status === 'starting')   // (2026-10-27) กำลังทำงานอยู่ ไม่ใช่ล้มเหลว
    return lateMin > 30 ? ['warn', `ทำงานนานผิดปกติ (เริ่ม ${ago(j.last_start)})`] : ['ok', 'กำลังทำงาน']
  if (j.last_status && j.last_status !== 'succeeded') return ['bad', 'ทำงานไม่สำเร็จในรอบล่าสุด']
  const hf = (j.schedule || '').trim().split(/\s+/)[1] || '*'
  const offHours = exp && exp < 60 && hf !== '*' && !inHours(hf, new Date().getUTCHours())   // (2026-10-27) งานที่ตั้งให้ทำเฉพาะบางช่วงเวลา (เช่น กลางคืน) ไม่นับว่าค้างนอกช่วงนั้น
  if (exp && !offHours && lateMin > exp * 2 + 10) return ['bad', `ไม่ได้ทำงานมา ${ago(j.last_start)} (กำหนดทุก ${exp >= 1440 ? (exp/1440)+' วัน' : exp >= 60 ? (exp/60)+' ชม.' : exp+' นาที'})`]
  if (j.fails_24h > 0) return ['warn', `ไม่สำเร็จ ${j.fails_24h} ครั้งใน 24 ชม.`]
  return ['ok', 'ปกติ']
}


// แปลง schedule (UTC) เป็นภาษาคน เวลาไทย
function thaiSched(sched) {
  const p = (sched || '').trim().split(/\s+/); if (p.length < 5) return sched || ''
  const [min, hour] = p
  const pad = n => String(n).padStart(2, '0')
  if (min.startsWith('*/') && hour === '*') return `ทุก ${min.slice(2)} นาที`
  if (hour === '*') return `ทุกชั่วโมง นาทีที่ ${pad(min)}`
  if (hour.startsWith('*/')) return `ทุก ${hour.slice(2)} ชม. นาทีที่ ${pad(min)}`
  if (/^\d+(,\d+)*$/.test(hour) && /^\d+$/.test(min)) return hour.split(',').map(h => `${pad((parseInt(h) + 7) % 24)}:${pad(min)}`).join(' / ') + ' ทุกวัน'
  return sched
}

async function load() {
  const [health, unknown, extra, adsHealth, recon, dgr] = await Promise.all([
    DB.rpc('system_health'),
    DB.rpc('unknown_skus', { p_days: UNKNOWN_SKU_DAYS }),
    DB.rpc('system_health_extra'),
    DB.from('v_ads_health_summary').select('*'),   // (2026-09-19) ตรวจค่าแอดหายรายวัน
    DB.rpc('recon_channel_monthly'),   // (2026-10-12) ยอดขายระบบ vs งบบัญชี (เฉพาะแอดมิน / สิทธิ์ต้นทุน)
    DB.rpc('data_status')   // Data Guard
  ])
  window._recon = recon; window._adsHealth = adsHealth
  window._dg = (dgr && !dgr.error && Array.isArray(dgr.data)) ? dgr.data : []
  if (health.error) { document.getElementById('content').innerHTML = `<div class="banner bad">โหลดไม่สำเร็จ: ${esc(health.error.message)}</div>`; return }
  await render(health.data, unknown, extra)
}

let TAB = 'feed', CRON_ALL = false
const thDate = d => d ? new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) : '—'
const sinceTxt = s => s ? 'ตั้งแต่ ' + new Date(s).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : ''
// (2026-10-27) เพจ Facebook: เพจที่ไม่ได้โพสต์ไม่ใช่ปัญหา · ควรตรวจสอบ token เฉพาะเมื่อวันหมดอายุที่บันทึกไว้ผ่านแล้ว และไม่มีโพสต์ใหม่เข้าระบบเกิน 14 วัน
function fbStatus(p) {
  if (p['สถานะ'] === 'ปิดใช้งาน') return 'ปิดใช้งาน'
  const exp = p['token_เหลือกี่วัน'], quiet = p['เงียบมากี่วัน']
  return exp != null && exp < 0 && quiet != null && quiet > 14 ? 'ควรตรวจสอบ token' : 'ปกติ'
}
// (2026-10-27) หน้าสถานะระบบข้อมูลแบบใหม่: แถบสรุป → รายการที่ต้องดำเนินการ (รวมทุกแหล่ง ไม่ซ้ำ) → การ์ดตัวเลข → รายละเอียดแยกแท็บ
async function render(d, unknown, extra) {
  const X = (extra && !extra.error) ? (extra.data || {}) : null
  document.getElementById('genAt').textContent = `ข้อมูล ณ ${th(d.generated_at)}`
  const cron = d.cron || [], mv = d.mv || [], sync = d.sync || [], ch = d.channels || []
  const unkRows = (!unknown.error && Array.isArray(unknown.data)) ? unknown.data : []
  const unkErr = unknown.error ? unknown.error.message : null
  const DG = window._dg || []
  const items = [], info = []
  const add = (sev, title, desc, act, since, detail) => (sev === 'info' ? info : items).push({ sev, title, desc: desc || '', act: act || '', since: since || null, detail: detail || '' })
  const badCron = cron.filter(j => cronState(j)[0] === 'bad'), warnCron = cron.filter(j => cronState(j)[0] === 'warn')
  const cronList = list => list.map(j => `• <b>${esc(j.jobname)}</b> — ${esc(cronState(j)[1])}${j.last_msg ? ' · ' + esc(String(j.last_msg).slice(0, 160)) : ''}`).join('<br>')

  // ① ผลตรวจตัวเลขอัตโนมัติ (Data Guard)
  const ACT = k => k === 'cron_fail' ? 'ดำเนินการ: ตรวจสอบรายละเอียดในแท็บงานตั้งเวลา'
    : (k === 'eq_ads_acct' || k === 'op_ads_acct') ? 'ดำเนินการ: ตรวจสอบยอดคงเหลือในบัญชีโฆษณาของแพลตฟอร์มที่ต่างเกินเกณฑ์'
    : k === 'http_fail' ? 'ไม่ต้องดำเนินการ หากจำนวนไม่เพิ่มขึ้น'
    : /^orders_(Facebook|Lazada)$/.test(k) ? 'ดำเนินการ: อัปโหลดไฟล์ออเดอร์ของช่องทางนี้ที่หน้าอัปโหลดข้อมูล'
    : /^orders_(ตัวแทน|Modern Trade)$/.test(k) ? 'ดำเนินการ: ตรวจสอบการอัปเดตชีทของช่องทางนี้'
    : /^orders_/.test(k) ? 'ดำเนินการ: ตรวจสอบการนำเข้าข้อมูลของช่องทางนี้'
    : 'ดำเนินการ: ตรวจสอบรายละเอียดในแท็บผลการตรวจสอบ'
  DG.filter(c => c.status !== 'ok').forEach(c => add(c.status === 'fail' ? 'bad' : 'warn', c.title, c.detail, ACT(c.k), c.since, c.k === 'cron_fail' && badCron.length ? cronList(badCron) : ''))
  if (!DG.some(c => c.k === 'cron_fail' && c.status !== 'ok') && badCron.length)
    add('bad', `งานตั้งเวลาทำงานไม่สำเร็จ ${badCron.length} งาน`, '', 'ดำเนินการ: ตรวจสอบรายละเอียดในแท็บงานตั้งเวลา', null, cronList(badCron))
  // ② รหัสสินค้าที่ไม่มีในฐานข้อมูลสินค้า
  if (unkRows.length) add('bad', `พบรหัสสินค้าที่ไม่มีในฐานข้อมูลสินค้า ${unkRows.length} รหัส`, 'ยอดขายของรหัสดังกล่าวไม่ถูกนับเข้าสินค้าใด',
    'ดำเนินการ: แก้ไขรหัสสินค้าในร้าน หรือเพิ่มรหัสที่หน้าสินค้า & ราคา', unkRows.map(r => r.first_date).filter(Boolean).sort()[0],
    unkRows.map(r => `• <span class="mono">${esc(r.parent_sku)}</span> — ${esc(r.channels)} ${fmt(r.orders)} คำสั่งซื้อ · ยอดเงิน ${fmt(r.revenue)} บาท · ล่าสุด ${esc(String(r.last_date || '').slice(0, 10))}`).join('<br>'))
  // ③ ตารางสรุปว่าง
  const unpop = mv.filter(m => !m.populated)
  if (unpop.length) add('bad', `ตารางสรุปไม่มีข้อมูล ${unpop.length} ตาราง`, unpop.map(m => m.name).join(', '), 'ดำเนินการ: แจ้งผู้ดูแลระบบให้คำนวณตารางสรุปใหม่')
  // ④ Token
  let metaTxt = '—', tokBad = false
  try {
    const { data: mt } = await DB.from('meta_token_status').select('*').eq('id', 1)
    const t = Array.isArray(mt) ? mt[0] : null
    if (t) {
      if (t.error || t.is_valid === false) { tokBad = true; metaTxt = 'ใช้งานไม่ได้'; add('bad', 'Token Meta Ads ใช้งานไม่ได้', esc(t.error || 'is_valid = false'), 'ดำเนินการ: สร้าง token ใหม่ แล้วบันทึกใน secret META_ADS_TOKEN', t.checked_at) }
      else if (t.days_left != null) {
        metaTxt = `เหลือ ${t.days_left} วัน`
        if (t.days_left <= 14) { tokBad = true; add(t.days_left <= 3 ? 'bad' : 'warn', `Token Meta Ads หมดอายุใน ${t.days_left} วัน`, `หมดอายุ ${thDate(t.expires_at)}`, 'ดำเนินการ: ต่ออายุ token แล้วบันทึกใน secret META_ADS_TOKEN') }
        else add('info', `Token Meta Ads หมดอายุ ${thDate(t.expires_at)} (เหลือ ${t.days_left} วัน) ระบบจะแจ้งเตือนเมื่อเหลือ 14 วัน`)
      }
    }
  } catch (e) { console.warn('meta_token_status', e) }
  let ttTxt = '—', ttNormalLag = false
  if (X) {
    const tk = X.tiktok_token || {}, until = tk['ต่ออายุได้ถึง'] ? String(tk['ต่ออายุได้ถึง']).slice(0, 10) : null
    const dRen = until ? daysTo(until) : null
    ttTxt = dRen == null ? '—' : dRen <= 14 ? `ต่ออายุได้อีก ${dRen} วัน` : 'ต่ออายุอัตโนมัติ'
    if (dRen != null && dRen <= 14) { tokBad = true; add(dRen <= 3 ? 'bad' : 'warn', `การเชื่อมต่อ TikTok จะหมดอายุใน ${dRen} วัน`, `ต่ออายุอัตโนมัติได้ถึง ${thDate(until)}`, 'ดำเนินการ: เชื่อมต่อบัญชี TikTok ใหม่ก่อนวันหมดอายุ') }
    (X.fb_pages || []).filter(p => fbStatus(p) === 'ควรตรวจสอบ token').forEach(p => { tokBad = true; add('warn', `ควรตรวจสอบ token ของเพจ ${p['ชื่อเพจ']}`, `ไม่มีโพสต์ใหม่เข้าระบบ ${p['เงียบมากี่วัน']} วัน และวันหมดอายุ token ที่บันทึกไว้ผ่านแล้ว`, 'ดำเนินการ: ตรวจสอบ token ของเพจในตาราง fb_pages') })
    // ⑤ TikTok สถิติช่อง: ตัวดึงไม่ทำงาน / TikTok ไม่ส่งข้อมูล / ล่าช้าตามปกติ
    let ttHandled = false
    const acc = (X.feeds || []).find(f => f['ตาราง'] === 'tiktok_account_daily')
    if (acc && acc['ข้อมูลล่าสุด'] && acc['ช้าไปกี่วัน'] != null) {
      const todayTH = new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10), gap = +acc['ช้าไปกี่วัน']
      const pulledToday = acc['ดึงล่าสุด'] ? new Date(new Date(acc['ดึงล่าสุด']).getTime() + 7 * 3600000).toISOString().slice(0, 10) === todayTH : false
      if (gap >= 2 && !pulledToday) { add('bad', 'ตัวดึงข้อมูล TikTok ไม่ได้ทำงานวันนี้', `ดึงข้อมูลครั้งล่าสุด ${th(acc['ดึงล่าสุด'])} · ข้อมูลถึง ${esc(String(acc['ข้อมูลล่าสุด']))}`, 'ดำเนินการ: ตรวจสอบงาน tiktok-organic-sync ในแท็บงานตั้งเวลา'); ttHandled = true }
      else if (gap > 2 && pulledToday) { add('warn', `TikTok ไม่ส่งข้อมูลมา ${gap - 1} วัน`, `ระบบดึงข้อมูลทุกวันตามปกติ (ล่าสุด ${th(acc['ดึงล่าสุด'])})`, 'ดำเนินการ: ตรวจสอบสถานะฝั่ง TikTok'); ttHandled = true }
      else if (gap === 2 && pulledToday) { add('info', 'TikTok ยังไม่ส่งข้อมูลของเมื่อวาน ตามปกติล่าช้า 1–2 วัน ระบบจะดึงข้อมูลใหม่รอบ 19:30'); ttHandled = true; ttNormalLag = true }
    }
    // ⑥ แหล่งข้อมูลล่าช้า · งานที่ไม่มีเวลารอ · ตารางที่อ่านไม่ได้
    ;(X.feeds || []).filter(f => f['สถานะ'] !== 'ปกติ' && !(ttHandled && f['ตาราง'] === 'tiktok_account_daily'))
      .forEach(f => add('warn', `แหล่งข้อมูลล่าช้า: ${f['แหล่ง']}`, `ข้อมูลล่าสุดถึง ${esc(String(f['ข้อมูลล่าสุด'] || '—'))} (ล่าช้า ${f['ช้าไปกี่วัน']} วัน)`, 'ดำเนินการ: ตรวจสอบตัวดึงข้อมูลของแหล่งนี้'))
    if ((X.cron_no_timeout || []).length) add('warn', `งานตั้งเวลา ${X.cron_no_timeout.length} งานยังไม่ได้กำหนดเวลารอ`, X.cron_no_timeout.map(c => c.jobname).join(', '), 'ดำเนินการ: กำหนดเวลารอให้งานดังกล่าว')
    if ((X.rls_on || []).length) add('bad', `ตาราง ${X.rls_on.length} ตารางยังไม่มีสิทธิ์อ่าน`, X.rls_on.join(', '), 'ระบบจะกำหนดสิทธิ์ให้ภายใน 5 นาที หากยังค้างให้แจ้งผู้ดูแลระบบ')
  }
  items.sort((a, b) => (a.sev === 'bad' ? 0 : 1) - (b.sev === 'bad' ? 0 : 1))

    document.getElementById('content').innerHTML = `<div class="hp-pane">${PANE[TAB] || ''}</div>`
  }
  window._hpRedrawCron = () => { PANE.cron = `<div class="hp-seg"><button type="button" class="${CRON_ALL ? '' : 'on'}" onclick="hpCronAll(false)">เฉพาะที่มีปัญหา (${probs.length})</button><button type="button" class="${CRON_ALL ? 'on' : ''}" onclick="hpCronAll(true)">ทั้งหมด ${cron.length} งาน</button></div>` + (CRON_ALL ? (P.cron || '') : probTbl) + (P.daily || '') + (P.mv || ''); window._hpDraw() }
  window._hpDraw()
}
window.hpTab = k => { TAB = k; window._hpDraw && window._hpDraw() }
window.hpCronAll = v => { CRON_ALL = !!v; window._hpRedrawCron && window._hpRedrawCron() }
document.getElementById('refreshBtn').onclick = load
load()
setInterval(load, 5 * 60 * 1000)
</script>
